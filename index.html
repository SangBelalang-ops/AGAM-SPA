<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID Card Generator - Sinaga Saudara Yakobus</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #1a110e 0%, #2b1d17 100%);
            color: #3a2e2b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card-container {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            overflow: hidden;
            border: 3px solid #c5a059;
            position: relative;
        }

        /* Bagian Atur Gambar / Header Gedung */
        .card-header-bg {
            width: 100%;
            height: 260px;
            background: #000;
            position: relative;
            overflow: hidden;
        }

        .card-header-bg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.9);
        }

        /* Frame Foto Profil Tengah */
        .profile-section {
            display: flex;
            justify-content: center;
            margin-top: -85px;
            position: relative;
            z-index: 10;
        }

        .profile-frame {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid #ffffff;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            background: #fff;
        }

        .profile-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Informasi Teks ID Card */
        .card-body {
            text-align: center;
            padding: 20px 25px 30px 25px;
        }

        .name-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: #1a110e;
            letter-spacing: 0.5px;
            line-height: 1.2;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .tower-info {
            font-size: 1rem;
            font-weight: 600;
            color: #7d6b63;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        /* Footer / Banner Akses Card */
        .card-footer-badge {
            background-color: #1a110e;
            color: #c5a059;
            text-align: center;
            padding: 12px;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 3px;
            border-top: 2px solid #c5a059;
            text-transform: uppercase;
        }

        .instruction {
            margin-top: 20px;
            color: #d1c2b4;
            font-size: 0.85rem;
            text-align: center;
            max-width: 400px;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- Background Gedung (Mengambil gambar dari foto yang kamu berikan) -->
        <div class="card-header-bg">
            <img src="image_d89175.jpg" alt="Building Background">
        </div>

        <!-- Foto Wajah / Profil -->
        <div class="profile-section">
            <div class="profile-frame">
                <!-- Foto diambil dari area tengah foto asli yang kamu unggah -->
                <img src="image_d89175.jpg" alt="Foto Profil" style="object-position: center 38%; transform: scale(2.2);">
            </div>
        </div>

        <!-- Detail Identitas -->
        <div class="card-body">
            <div class="name-title">SINAGA SAUDARA YAKOBUS</div>
            <div class="tower-info">Tower: T2-F20</div>
        </div>

        <!-- Footer Card -->
        <div class="card-footer-badge">
            ACCESS CARD
        </div>
    </div>

    <div class="instruction">
        <p>Nama pada ID Card telah berhasil diubah menjadi <strong>SINAGA SAUDARA YAKOBUS</strong> sesuai dengan permintaan Anda.</p>
    </div>

</body>
</html>
